name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter pub get
        working-directory: live_audio_room
      - run: flutter build apk --release
        working-directory: live_audio_room
      - uses: actions/upload-artifact@v4
        with:
          name: LamaShpawa-APK
          path: live_audio_room/build/app/outputs/flutter-apk/app-release.apk
