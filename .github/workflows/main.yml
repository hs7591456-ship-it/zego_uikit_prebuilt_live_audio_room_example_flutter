name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Fix Kotlin
        run: |
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" live_audio_room/android/build.gradle
      - run: |
          cd live_audio_room
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: LamaShpawa-APK
          path: live_audio_room/build/app/outputs/flutter-apk/app-release.apk
