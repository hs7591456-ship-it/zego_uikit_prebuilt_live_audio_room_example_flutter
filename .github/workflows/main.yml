name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Pub get
        run: flutter pub get
        working-directory: live_audio_room
      - name: Build APK
        run: flutter build apk --release --verbose
        working-directory: live_audio_room
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LamaShpawa-APK
          path: live_audio_room/build/app/outputs/flutter-apk/app-release.apk
